name: C6 Career Command Centre

on:
  pull_request:
    paths:
      - "career_engine/**"
      - "portal/**"
      - "tests/test_career_engine.py"
      - "tests/test_portal.py"
      - "tests/test_tracker.py"
      - "tests/test_adapters.py"
      - "tools/hash_career_password.py"
      - "Dockerfile.career"
  push:
    branches:
      - c6-private-career-command-centre

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall career_engine portal tests tools/hash_career_password.py
      - name: Run career tests
        run: python -m unittest tests.test_career_engine tests.test_portal tests.test_tracker tests.test_adapters tests.test_career_end_state
